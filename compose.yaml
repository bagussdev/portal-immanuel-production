name: immanuel-production

services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - storage_data:/var/www/html/storage:ro

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"

  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage_data:/var/www/html/storage

  queue:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - storage_data:/var/www/html/storage

volumes:
  mysql_data:
  storage_data:
