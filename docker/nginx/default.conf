map $http_x_forwarded_host $immanuel_forwarded_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}

map $http_x_forwarded_proto $immanuel_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $immanuel_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $immanuel_forwarded_proto;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:env|log|sql|sqlite|bak)$ { deny all; }
    client_max_body_size 8m;
}
